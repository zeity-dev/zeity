packages:
  # all packages in sub dirs of packages/ and apps/
  - "libs/**"
  - "apps/**"

ignoreWorkspaceRootCheck: true

trustPolicyExclude:
  - chokidar@4.0.3
  - rollup@2.80.0
  - semver@6.3.1
  - xlsx@0.20.3

overrides:
  "h3": "1.15.11"
  "h3-next": "npm:h3@2.0.1-rc.31"
  "zod": "^4.5.4"
  "@netlify/functions": "-"
  "@netlify/blobs": "-"

shamefullyHoist: true
reporter: append-only

allowBuilds:
  better-sqlite3: true
  sharp: true
  "@parcel/watcher": false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@nuxt/kit@4.5.1'
  - '@nuxt/nitro-server@4.5.1'
  - '@nuxt/schema@4.5.1'
  - '@nuxt/vite-builder@4.5.1'
  - nuxt@4.5.1
